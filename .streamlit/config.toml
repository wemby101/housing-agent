primaryColor = "#1F4E8C"             # 도로명주소판 남색
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4EFEA"
textColor = "#1F2430"
font = "IBM Plex Sans KR:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap, sans-serif"
