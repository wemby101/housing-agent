# Vercel(Geist) 디자인: 거의 흰 바탕 + 먹색 한 가지, 얇은 테두리, 장식은 맨 위 그라데이션 하나
[theme]
base = "light"
primaryColor = "#171717"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#ffffff"   # 입력칸·카드
textColor = "#171717"
linkColor = "#0070f3"
borderColor = "#ebebeb"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "full"                  # 알약 모양 버튼
headingFontWeights = 600
# Geist에는 한글이 없어 한글은 Pretendard로 넘어간다
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap, Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
# 위험(빨강)·주의(주황)·안내(파랑)
redColor = "#ee0000"
redTextColor = "#c50000"
redBackgroundColor = "#fdecec"
yellowColor = "#f5a623"
yellowTextColor = "#ab570a"
yellowBackgroundColor = "#ffefcf"
blueColor = "#0070f3"
blueTextColor = "#0761d1"
blueBackgroundColor = "#eaf3ff"
greenTextColor = "#0761d1"             # Vercel은 성공도 파랑으로 표시
greenBackgroundColor = "#eaf3ff"
